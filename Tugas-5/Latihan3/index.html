<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>REGISTRATION FORM</h1>

    <form id="registration-form" novalidate>
      <div class="field">
        <label for="name">Name:</label>
        <input id="name" name="name" type="text" placeholder="Enter your full name" autocomplete="name" required aria-describedby="name-error">
        <p id="name-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="address">Address:</label>
        <input id="address" name="address" type="text" placeholder="Enter your address" autocomplete="street-address" required aria-describedby="address-error">
        <p id="address-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email">E-mail Address:</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required aria-describedby="email-error">
        <p id="email-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password:</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-error">
        <p id="password-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="course">Select Your Course:</label>
        <select id="course" name="course" required aria-describedby="course-error">
          <option value="">Select Course</option>
          <option value="web-programming">Web Programming</option>
          <option value="computer-networks">Computer Networks</option>
          <option value="database">Database System</option>
          <option value="data-structures">Data Structures</option>
        </select>
        <p id="course-error" class="error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="college">College Name:</label>
        <textarea id="college" name="college" rows="2" required aria-describedby="college-error"></textarea>
        <p id="college-error" class="error" aria-live="polite"></p>
      </div>

      <div class="agreement">
        <label for="agreement">
          <input id="agreement" name="agreement" type="checkbox" required aria-describedby="agreement-error">
          I agree to the above information
        </label>
        <p id="agreement-error" class="error" aria-live="polite"></p>
      </div>

      <div class="actions">
        <button type="submit">Send</button>
        <button type="reset">Reset</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
