<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Pendaftaran Anggota | LibraryReg</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="style.css"
      rel="stylesheet"
    />
    <script
      src="script.js"
      defer
    ></script>
  </head>
  <body class="form-page">
    <main class="registration-box panel">
      <div class="registration-heading">
        <h1 id="form-title">Pendaftaran anggota</h1>
        <p class="muted">Semua kolom wajib diisi.</p>
      </div>
      <form id="member-form">
        <input
          id="member-id"
          type="hidden"
        />
        <div class="form-grid">
          <div class="field">
            <label for="nama">Nama lengkap</label
            ><input
              id="nama"
              name="nama"
              autocomplete="name"
              maxlength="100"
              required
            />
          </div>
          <div class="field">
            <label for="nomor">NIM / NIP</label
            ><input
              id="nomor"
              name="nomor"
              inputmode="numeric"
              pattern="[0-9]+"
              title="NIM / NIP hanya boleh berisi angka."
              maxlength="30"
              required
            />
          </div>
          <div class="field">
            <label for="prodi">Program studi / unit kerja</label>
            <select
              id="prodi"
              name="prodi"
              required
            >
              <option value="">Pilih program studi / unit</option>
              <option>Informatika</option>
              <option>Sistem Informasi</option>
              <option>Teknik Komputer</option>
              <option>Manajemen</option>
              <option>Akuntansi</option>
              <option>Administrasi</option>
              <option>Lainnya</option>
            </select>
            <div
              id="prodi-manual-field"
              class="field"
              hidden
            >
              <label for="prodi-manual">Nama program studi / unit kerja</label>
              <input
                id="prodi-manual"
                maxlength="100"
                disabled
              />
            </div>
          </div>
          <div class="field">
            <label for="jenis">Jenis keanggotaan</label>
            <select
              id="jenis"
              name="jenis"
              required
            >
              <option value="">Pilih keanggotaan</option>
              <option>Mahasiswa</option>
              <option>Dosen</option>
              <option>Tenaga kependidikan</option>
            </select>
          </div>
          <div class="field">
            <label for="telepon">Nomor telepon</label
            ><input
              id="telepon"
              name="telepon"
              type="tel"
              autocomplete="tel"
              pattern="\+?[0-9]{8,15}"
              title="Isi 8–15 angka, boleh diawali +."
              required
            />
          </div>
          <div class="field">
            <label for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              maxlength="150"
              required
            />
          </div>
          <div class="field full">
            <label for="alamat">Alamat</label
            ><textarea
              id="alamat"
              name="alamat"
              autocomplete="street-address"
              rows="2"
              maxlength="300"
              required
            ></textarea>
          </div>
        </div>
        <p
          id="form-error"
          class="error"
          role="alert"
        ></p>
        <div class="actions">
          <button
            id="submit-button"
            class="btn btn-success"
            type="submit"
          >
            Simpan pendaftaran
          </button>
          <button
            id="reset-button"
            class="btn btn-outline-secondary"
            type="button"
          >
            Batal
          </button>
        </div>
      </form>
      <div
        id="notification"
        role="status"
        hidden
      ></div>
      <a
        id="back-link"
        class="back-link"
        href="index.html"
        >Kembali ke beranda</a
      >
    </main>
  </body>
</html>
