<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Data Anggota | LibraryReg</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="style.css"
      rel="stylesheet"
    />
    <script
      src="script.js"
      defer
    ></script>
  </head>
  <body class="admin-page">
    <main
      id="database-board"
      class="database-board panel"
      hidden
    >
      <div class="board-heading">
        <div>
          <a
            class="board-brand"
            href="index.html"
            >LibraryReg</a
          >
          <h1>Data anggota</h1>
        </div>
        <div class="board-actions">
          <a
            class="btn btn-success"
            href="form.html"
            >+ Tambah anggota</a
          >
          <button
            id="logout-button"
            class="btn btn-outline-secondary"
            type="button"
          >
            Keluar
          </button>
        </div>
      </div>

      <div class="table-toolbar">
        <p
          id="member-count"
          aria-live="polite"
        >
          0 anggota
        </p>
        <input
          id="search"
          type="search"
          placeholder="Cari nama atau NIM / NIP"
          aria-label="Cari nama atau NIM / NIP"
        />
      </div>

      <div
        class="table-responsive"
        tabindex="0"
        role="region"
        aria-label="Tabel data anggota"
      >
        <table class="table align-middle">
          <thead>
            <tr>
              <th scope="col">Nama anggota</th>
              <th scope="col">NIM / NIP</th>
              <th scope="col">Program studi / unit</th>
              <th scope="col">Keanggotaan</th>
              <th scope="col">Tindakan</th>
            </tr>
          </thead>
          <tbody id="member-list"></tbody>
        </table>
      </div>

      <p
        id="empty-state"
        class="empty-state"
      >
        Belum ada anggota.
      </p>
      <div
        id="notification"
        role="status"
        hidden
      ></div>
      <div class="board-footer">
        <a href="index.html">Kembali ke beranda</a>
        <span>Petugas · Penyimpanan lokal</span>
      </div>
    </main>

    <dialog id="detail-dialog">
      <h2>Detail anggota</h2>
      <dl id="member-detail"></dl>
      <button
        class="btn btn-success"
        type="button"
        onclick="this.closest('dialog').close()"
      >
        Tutup
      </button>
    </dialog>
  </body>
</html>
