<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe Kehidupan Santri</title>
  <desc id="desc">Kerangka halaman kehidupan santri dengan pembinaan, tab panduan seragam, kegiatan ekstrakurikuler, dan struktur OSPETA.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#333}.frame{fill:#fff;stroke:#999;stroke-width:2}.block{fill:#f0f0f0;stroke:#aaa;stroke-width:2}.dark{fill:#ddd;stroke:#999;stroke-width:2}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#555}.muted{fill:#666}</style></defs>
  <rect width="1000" height="1450" fill="#fff"/>
  <rect class="frame" x="40" y="32" width="920" height="76" rx="4"/><rect class="dark" x="58" y="50" width="42" height="40" rx="20"/><text class="small" x="111" y="67">LOGO</text><text class="label" x="111" y="88">SMAIT AL KAHFI</text><text class="small" x="350" y="77">Beranda   Jurusan   Kehidupan Santri   Alumni   Kontak</text><rect class="dark" x="822" y="51" width="120" height="38" rx="3"/><text class="small" x="842" y="76">Pendaftaran</text>
  <rect class="block" x="40" y="128" width="920" height="175" rx="4"/><text class="small muted" x="70" y="174">KEHIDUPAN SANTRI</text><text class="label" x="70" y="220">Pembinaan dan kegiatan santri</text><text class="body" x="70" y="251">Program karakter, minat, bakat, dan kepemimpinan</text><rect class="dark" x="70" y="265" width="720" height="28" rx="3"/><text class="small" x="88" y="285">Pembinaan   Seragam   Ekstrakurikuler   OSPETA</text>
  <text class="label" x="60" y="360">Pembinaan santri</text><rect class="block" x="40" y="383" width="445" height="145" rx="4"/><rect class="block" x="515" y="383" width="445" height="145" rx="4"/><text class="body" x="68" y="422">Pembentukan karakter</text><text class="small" x="68" y="457">Disiplin, Adiwiyata, rihlah ilmiah, lomba</text><text class="body" x="543" y="422">Bimbingan konseling</text><text class="small" x="543" y="457">Konseling pribadi, belajar, minat dan bakat</text>
  <text class="label" x="60" y="592">Panduan seragam</text><rect class="dark" x="40" y="615" width="920" height="48" rx="3"/><text class="small" x="72" y="645">Senin-Selasa         Rabu         Kamis         Jumat-Sabtu</text><rect class="block" x="40" y="680" width="445" height="200" rx="4"/><rect class="block" x="515" y="680" width="445" height="200" rx="4"/><circle cx="262" cy="778" r="55" fill="#ddd" stroke="#aaa"/><circle cx="737" cy="778" r="55" fill="#ddd" stroke="#aaa"/><text class="small" x="219" y="860">Seragam Ikhwan</text><text class="small" x="693" y="860">Seragam Akhwat</text>
  <text class="label" x="60" y="934">Ekstrakurikuler</text><rect class="block" x="40" y="956" width="210" height="130" rx="4"/><rect class="block" x="277" y="956" width="210" height="130" rx="4"/><rect class="block" x="514" y="956" width="210" height="130" rx="4"/><rect class="block" x="750" y="956" width="210" height="130" rx="4"/><text class="small" x="71" y="1012">Kegiatan</text><text class="small" x="308" y="1012">Kegiatan</text><text class="small" x="545" y="1012">Kegiatan</text><text class="small" x="781" y="1012">Kegiatan</text><text class="small muted" x="323" y="1110">Pilih kartu untuk membuka dialog detail</text>
  <text class="label" x="60" y="1160">Struktur OSPETA</text><rect class="block" x="40" y="1183" width="445" height="176" rx="4"/><rect class="block" x="515" y="1183" width="445" height="176" rx="4"/><text class="body" x="68" y="1222">OSPETA Ikhwan</text><text class="small" x="68" y="1256">Ketua / pengurus / divisi kerja</text><rect class="dark" x="90" y="1280" width="340" height="50" rx="3"/><text class="body" x="543" y="1222">OSPETA Akhwat</text><text class="small" x="543" y="1256">Ketua / pengurus / divisi kerja</text><rect class="dark" x="565" y="1280" width="340" height="50" rx="3"/>
  <rect class="frame" x="40" y="1390" width="920" height="32" rx="3"/><text class="small" x="60" y="1412">Footer bersama</text>
</svg>