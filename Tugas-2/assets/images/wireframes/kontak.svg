<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1390" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe Kontak SMAIT Al Kahfi</title>
  <desc id="desc">Kerangka halaman kontak dengan detail alamat, peta, formulir email, kanal media sosial, video, dan tautan pendaftaran.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#333}.frame{fill:#fff;stroke:#999;stroke-width:2}.block{fill:#f0f0f0;stroke:#aaa;stroke-width:2}.dark{fill:#ddd;stroke:#999;stroke-width:2}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#555}.muted{fill:#666}</style></defs>
  <rect width="1000" height="1390" fill="#fff"/>
  <rect class="frame" x="40" y="32" width="920" height="76" rx="4"/><rect class="dark" x="58" y="50" width="42" height="40" rx="20"/><text class="small" x="111" y="67">LOGO</text><text class="label" x="111" y="88">SMAIT AL KAHFI</text><text class="small" x="350" y="77">Beranda   Jurusan   Kehidupan Santri   Alumni   Kontak</text><rect class="dark" x="822" y="51" width="120" height="38" rx="3"/><text class="small" x="842" y="76">Pendaftaran</text>
  <rect class="block" x="40" y="128" width="920" height="155" rx="4"/><text class="small muted" x="70" y="172">KONTAK</text><text class="label" x="70" y="215">Hubungi SMAIT Al Kahfi</text><text class="body" x="70" y="247">Informasi sekolah, kebutuhan santri, pendaftaran, dan kerja sama</text><text class="small" x="70" y="272">Informasi kontak   Form kontak   Media sosial</text>
  <text class="label" x="60" y="345">Alamat dan layanan sekolah</text><rect class="block" x="40" y="368" width="420" height="245" rx="4"/><text class="body" x="68" y="410">Alamat sekolah</text><text class="small" x="68" y="443">Telepon dan email</text><text class="small" x="68" y="476">Jam layanan</text><line x1="68" y1="500" x2="420" y2="500" stroke="#bbb"/><text class="small muted" x="68" y="542">Informasi kontak dapat dipilih</text><rect class="dark" x="490" y="368" width="470" height="245" rx="4"/><path d="M510 570 L590 445 L670 520 L760 410 L940 565" fill="#ccc" stroke="#aaa"/><text class="small" x="670" y="594">Peta lokasi sekolah</text>
  <text class="label" x="60" y="680">Kirim pesan</text><rect class="block" x="40" y="703" width="420" height="205" rx="4"/><text class="body" x="68" y="748">Petunjuk formulir kontak</text><text class="small" x="68" y="782">Email dibuka di aplikasi pengguna</text><text class="small" x="68" y="812">Pesan terkirim setelah dikirim manual</text><rect class="frame" x="490" y="703" width="470" height="205" rx="4"/><text class="small muted" x="516" y="740">Nama</text><line x1="516" y1="750" x2="934" y2="750" stroke="#bbb"/><text class="small muted" x="516" y="783">Email</text><line x1="516" y1="793" x2="934" y2="793" stroke="#bbb"/><text class="small muted" x="516" y="826">Pesan</text><rect class="dark" x="516" y="850" width="135" height="40" rx="3"/><text class="small" x="540" y="876">Kirim pesan</text>
  <text class="label" x="60" y="963">Kanal resmi sekolah</text><rect class="block" x="40" y="985" width="445" height="72" rx="3"/><rect class="block" x="515" y="985" width="445" height="72" rx="3"/><text class="body" x="68" y="1028">Instagram sekolah</text><text class="body" x="543" y="1028">YouTube sekolah</text>
  <text class="label" x="60" y="1105">Video YouTube</text><rect class="block" x="40" y="1128" width="290" height="116" rx="3"/><rect class="block" x="355" y="1128" width="290" height="116" rx="3"/><rect class="block" x="670" y="1128" width="290" height="116" rx="3"/><text class="small" x="125" y="1192">Video sekolah</text><text class="small" x="440" y="1192">Video sekolah</text><text class="small" x="755" y="1192">Video sekolah</text>
  <rect class="dark" x="40" y="1270" width="920" height="65" rx="4"/><text class="label" x="65" y="1310">Penerimaan santri baru</text><rect class="frame" x="740" y="1282" width="195" height="40" rx="3"/><text class="small" x="758" y="1308">Pendaftaran resmi</text><rect class="frame" x="40" y="1350" width="920" height="28" rx="3"/><text class="small" x="60" y="1370">Footer bersama</text>
</svg>