<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1540" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe Beranda SMAIT Al Kahfi</title>
  <desc id="desc">Kerangka halaman beranda desktop dengan hero foto kampus, nilai, sambutan kepala sekolah, visi misi, tautan informasi, dan pendaftaran.</desc>
  <defs><style>
    text{font-family:Arial,sans-serif;fill:#333}.frame{fill:#fff;stroke:#999;stroke-width:2}.block{fill:#f0f0f0;stroke:#aaa;stroke-width:2}.dark{fill:#ddd;stroke:#999;stroke-width:2}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#555}.muted{fill:#666}.light{fill:#fff}
  </style></defs>
  <rect width="1000" height="1540" fill="#fff"/>
  <rect class="frame" x="40" y="32" width="920" height="76" rx="4"/>
  <rect class="dark" x="58" y="50" width="42" height="40" rx="20"/><text class="small" x="111" y="67">LOGO</text><text class="label" x="111" y="88">SMAIT AL KAHFI</text>
