  <rect class="dark" x="40" y="128" width="920" height="340" rx="4"/><path d="M40 425 L270 270 L420 390 L600 215 L960 435" fill="#c8c8c8"/><rect x="40" y="128" width="920" height="340" fill="#222" opacity=".4"/>
