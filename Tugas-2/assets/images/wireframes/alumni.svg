<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1370" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe Alumni SMAIT Al Kahfi</title>
  <desc id="desc">Kerangka halaman alumni dengan ringkasan statistik, filter dan tabel pencarian, cerita alumni, dan formulir berbagi cerita.</desc>
