<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1460" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe Jurusan dan Kurikulum</title>
  <desc id="desc">Kerangka halaman jurusan desktop yang menampilkan navigasi bagian, program IPA dan IPS, tabel siswa, program pendukung, dan pencarian guru.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#333}.frame{fill:#fff;stroke:#999;stroke-width:2}.block{fill:#f0f0f0;stroke:#aaa;stroke-width:2}.dark{fill:#ddd;stroke:#999;stroke-width:2}.label{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#555}.muted{fill:#666}</style></defs>
  <rect width="1000" height="1460" fill="#fff"/>
  <rect class="frame" x="40" y="32" width="920" height="76" rx="4"/><rect class="dark" x="58" y="50" width="42" height="40" rx="20"/><text class="small" x="111" y="67">LOGO</text><text class="label" x="111" y="88">SMAIT AL KAHFI</text><text class="small" x="350" y="77">Beranda   Jurusan   Kehidupan Santri   Alumni   Kontak</text><rect class="dark" x="822" y="51" width="120" height="38" rx="3"/><text class="small" x="842" y="76">Pendaftaran</text>
  <rect class="block" x="40" y="128" width="920" height="185" rx="4"/><text class="small muted" x="70" y="175">JURUSAN DAN KURIKULUM</text><text class="label" x="70" y="220">Program pembelajaran SMAIT Al Kahfi</text><text class="body" x="70" y="252">Pengantar program akademik nasional dan pesantren</text><rect class="dark" x="70" y="270" width="820" height="30" rx="3"/><text class="small" x="90" y="291">Daftar jurusan   Jumlah siswa   Program tambahan   Tenaga pendidik</text>
  <text class="label" x="60" y="365">Daftar jurusan</text><rect class="block" x="40" y="390" width="445" height="280" rx="4"/><rect class="block" x="515" y="390" width="445" height="280" rx="4"/><text class="label" x="68" y="432">Jurusan IPA</text><text class="small" x="68" y="465">Fokus sains, matematika, penelitian</text><line x1="68" y1="486" x2="450" y2="486" stroke="#bbb"/><text class="body" x="68" y="523">Mata pelajaran</text><text class="small" x="68" y="555">Fisika · Kimia · Biologi</text><text class="small" x="68" y="582">Matematika · Karya ilmiah · Umum</text><text class="label" x="543" y="432">Jurusan IPS</text><text class="small" x="543" y="465">Fokus masyarakat, ekonomi, sejarah</text><line x1="543" y1="486" x2="925" y2="486" stroke="#bbb"/><text class="body" x="543" y="523">Mata pelajaran</text><text class="small" x="543" y="555">Sosiologi · Geografi · Ekonomi</text><text class="small" x="543" y="582">Sejarah · Karya ilmiah · Umum</text>
  <text class="label" x="60" y="720">Jumlah siswa</text><rect class="frame" x="40" y="744" width="920" height="176"/><rect class="dark" x="40" y="744" width="920" height="42"/><line x1="270" y1="744" x2="270" y2="920" stroke="#aaa"/><line x1="640" y1="744" x2="640" y2="920" stroke="#aaa"/><line x1="40" y1="786" x2="960" y2="786" stroke="#aaa"/><line x1="40" y1="852" x2="960" y2="852" stroke="#aaa"/><text class="small" x="58" y="772">Jurusan</text><text class="small" x="288" y="772">Fokus pembelajaran</text><text class="small" x="658" y="772">Jumlah siswa</text><text class="small" x="58" y="827">IPA</text><text class="small" x="288" y="827">Sains dan matematika</text><text class="small" x="658" y="827">Belum dipublikasikan</text><text class="small" x="58" y="893">IPS</text><text class="small" x="288" y="893">Sosial dan ekonomi</text><text class="small" x="658" y="893">Belum dipublikasikan</text>
