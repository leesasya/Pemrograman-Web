<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="KelasKode, learning hub programming dengan jalur belajar dan proyek praktis."
    />
    <title>Daftar | KelasKode</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="assets/bootstrap.bundle.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Lewati ke konten</a>
    <header
      class="container auth-header d-flex justify-content-between align-items-center"
    >
      <a class="brand" href="index.html" aria-label="KelasKode beranda"
        >kelas<span>kode</span><b aria-hidden="true">.</b></a
      ><a class="back-link" href="index.html">&#8592; Kembali ke beranda</a>
    </header>
    <main class="container auth-main" id="main">
      <div class="row g-5 align-items-center">
        <section class="col-lg-5 offset-lg-3">
          <div class="auth-panel">
            <h2>Buat akun KelasKode</h2>
            <p class="auth-subtitle">
              Sudah punya akun? <a href="login.html">Masuk di sini</a>
            </p>
            <form id="auth-form" data-mode="register" novalidate>
              <div class="mb-3">
                <label class="form-label" for="name">Nama lengkap</label
                ><input
                  class="form-control"
                  id="name"
                  name="name"
                  type="text"
                  autocomplete="name"
                  required
                  aria-describedby="name-error"
                />
                <div class="invalid-feedback" id="name-error"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="email">Email</label
                ><input
                  class="form-control"
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                  aria-describedby="email-error"
                />
                <div class="invalid-feedback" id="email-error"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Password</label
                ><input
                  class="form-control"
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  required
                  minlength="8"
                  aria-describedby="password-error"
                />
                <div class="invalid-feedback" id="password-error"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="confirmation"
                  >Konfirmasi password</label
                ><input
                  class="form-control"
                  id="confirmation"
                  name="confirmation"
                  type="password"
                  autocomplete="new-password"
                  required
                  minlength="8"
                  aria-describedby="confirmation-error"
                />
                <div class="invalid-feedback" id="confirmation-error"></div>
              </div>
              <div class="form-check mb-4">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="show-password"
                /><label class="form-check-label" for="show-password"
                  >Tampilkan password</label
                >
              </div>
              <button class="btn btn-ink w-100" type="submit">
                Buat akun <span aria-hidden="true">&#8599;</span>
              </button>
              <div
                class="alert mt-3 mb-0"
                id="form-status"
                role="status"
                hidden
              ></div>
            </form>
          </div>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container d-flex flex-wrap justify-content-between gap-3">
        <a class="brand" href="index.html" aria-label="KelasKode beranda"
          >kelas<span>kode</span><b aria-hidden="true">.</b></a
        ><span
          >Tugas Pemrograman Web B &middot; Khalisya Zahra Putria Rahman</span
        >
      </div>
    </footer>
  </body>
</html>
